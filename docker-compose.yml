# Offline deployment: `docker compose up -d --build` (online build host) or
# scripts/install-offline.sh (air-gapped host, from a saved image bundle).
# UI + API are served from one origin: http://<host>:${SATSA_PORT:-8080}

x-api-env: &api-env
  SOC_INSPECT_ENV: ${SOC_INSPECT_ENV:-demo}
  DEMO_AUTH_DISABLED: ${DEMO_AUTH_DISABLED:-true}
  JWT_SECRET: ${JWT_SECRET:-}
  SEED_DEMO: ${SEED_DEMO:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-}

services:
  api:
    image: sat-sa/api:${SATSA_VERSION:-1.0}
    build:
      context: ./backend
    environment:
      <<: *api-env
    volumes:
      - satsa-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 120s

  web:
    image: sat-sa/web:${SATSA_VERSION:-1.0}
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SATSA_BIND:-0.0.0.0}:${SATSA_PORT:-8080}:80"
    restart: unless-stopped

  # Optional production profile: `docker compose --profile production up -d`
  # and set DATABASE_URL=postgresql+psycopg://soc:<pw>@postgres:5432/soc_inspect on api.
  postgres:
    image: postgres:16-alpine
    profiles: ["production"]
    environment:
      POSTGRES_DB: soc_inspect
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  satsa-data:
  postgres-data:
